<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Kuljetuspalvelu MJ">
  <title>Kuljetuspalvelu MJ</title>
  <!-- White logo for dark navy (#0b2545). Flat speed bar + sharp chevron. -->
  <g fill="#FFFFFF">
    <text
      x="160"
      y="98"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="92"
      font-weight="800"
      letter-spacing="-4"
    >MJ</text>

    <!-- Motion streaks -->
    <rect x="72" y="118" width="22" height="2" rx="1" opacity="0.4"/>
    <rect x="66" y="125" width="30" height="2.2" rx="1.1" opacity="0.65"/>

    <!-- Flat speed bar (even thickness) + chevron tip -->
    <rect x="78" y="130" width="158" height="5" rx="1.5"/>
    <polygon points="236,124 258,132.5 236,141"/>

    <text
      x="160"
      y="170"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="14"
      font-weight="700"
      letter-spacing="6"
    >KULJETUSPALVELU</text>
  </g>
</svg>
