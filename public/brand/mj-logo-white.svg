<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Kuljetuspalvelu MJ">
  <title>Kuljetuspalvelu MJ</title>
  <!-- White logo for dark navy (#0b2545). Angular speed stripe + chevron. -->
  <g fill="#FFFFFF">
    <text
      x="160"
      y="96"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="92"
      font-weight="800"
      letter-spacing="-4"
    >MJ</text>

    <!-- Stepped motion streaks (left) -->
    <rect x="78" y="116" width="20" height="2.2" rx="1.1" opacity="0.45"/>
    <rect x="72" y="123" width="28" height="2.4" rx="1.2" opacity="0.7"/>

    <!-- Main speed bar + sharp chevron tip -->
    <rect x="78" y="130" width="156" height="5.5" rx="1.2"/>
    <polygon points="234,123 260 132.75 234,142.5"/>

    <text
      x="160"
      y="170"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
      font-size="14"
      font-weight="700"
      letter-spacing="6"
    >KULJETUSPALVELU</text>
  </g>
</svg>
